<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>페이지를 찾을 수 없어요 — 새싹지원사업</title>
<link rel="icon" href="images/logo.png" type="image/png" />
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap">
<style>
:root {
  --bg: #fbfaf6; --card: #ffffff; --ink: #14181f; --ink-2: #3a4250; --ink-3: #6c7280;
  --line: #e6e3da; --sage: #8da888; --sage-deep: #5c7a5a; --sage-soft: #d8e3d4; --cream: #f1ead9;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; min-height: 100vh; background: var(--bg); color: var(--ink); }
body {
  font-family: "Pretendard Variable", "Pretendard", -apple-system, "Apple SD Gothic Neo", system-ui, sans-serif;
  display: flex; align-items: center; justify-content: center;
  padding: 40px 24px;
  background:
    radial-gradient(900px 500px at 80% 30%, rgba(141,168,136,.18), transparent 60%),
    radial-gradient(700px 400px at 10% 80%, rgba(91,127,179,.10), transparent 60%),
    var(--bg);
}
.box {
  background: var(--card); border: 1px solid var(--line);
  border-radius: 24px; padding: 60px 40px;
  text-align: center; max-width: 540px; width: 100%;
  box-shadow: 0 4px 16px rgba(20,24,31,.06);
}
.han {
  font-family: "Cormorant Garamond", serif; font-style: italic;
  font-size: 96px; color: var(--sage-deep);
  line-height: 1; margin-bottom: 16px;
}
h1 { font-size: 28px; font-weight: 800; margin: 0 0 12px; letter-spacing: -.02em; }
p { color: var(--ink-2); margin: 0 0 28px; line-height: 1.6; font-size: 15px; }
.btn-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.btn {
  display: inline-block; padding: 13px 22px; border-radius: 10px;
  font-weight: 700; font-size: 14px; text-decoration: none; transition: all .15s;
  font-family: inherit; border: 1px solid transparent;
}
.btn.primary { background: var(--ink); color: white; }
.btn.primary:hover { background: var(--sage-deep); }
.btn.ghost { background: transparent; color: var(--ink-2); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--ink); color: var(--ink); }
.foot { margin-top: 32px; font-size: 12px; color: var(--ink-3); }
</style>
</head>
<body>
<div class="box">
  <div class="han">404</div>
  <h1>페이지를 찾을 수 없어요</h1>
  <p>주소가 잘못되었거나, 베타 단계에서 아직 준비되지 않은 페이지입니다.<br />
     메인으로 돌아가서 다른 기능을 사용해보세요.</p>
  <div class="btn-row">
    <a class="btn primary" href="/">← 메인으로</a>
    <a class="btn ghost" href="mentor.html">AI 멘토링</a>
  </div>
  <div class="foot">새싹지원사업 · 전국 17개 시도 청년창업 통합 플랫폼 · 베타 운영 중</div>
</div>
</body>
</html>
