<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>결제 완료 — 새싹매치</title>
<script src="supabase-config.js" defer></script>
<script src="admin-config.js" defer></script>
<script src="payments.js" defer></script>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<style>
:root { --bg:#fbfaf6; --card:#fff; --ink:#14181f; --ink-2:#3a4250; --ink-3:#6c7280; --line:#e6e3da; --sage:#8da888; --sage-deep:#5c7a5a; --sage-soft:#d8e3d4; --bad:#b91c1c; --good:#2f7a3c; }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--ink); font-family:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; }
.card { width:100%; max-width:520px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:32px; box-shadow:0 4px 16px rgba(20,24,31,.06),0 12px 32px rgba(20,24,31,.05); }
.brand { display:flex; align-items:center; gap:8px; font-weight:800; margin-bottom:24px; }
.brand img { width:32px; height:32px; }
h1 { margin:0 0 8px; font-size:26px; letter-spacing:-.02em; }
p { margin:0; color:var(--ink-2); line-height:1.65; }
.box { margin:20px 0; padding:16px; border-radius:12px; background:var(--sage-soft); border:1px solid var(--sage); color:var(--sage-deep); font-weight:700; }
.error { background:#fef2f2; border-color:#fecaca; color:var(--bad); }
.actions { display:flex; gap:10px; margin-top:22px; flex-wrap:wrap; }
a { display:inline-flex; justify-content:center; padding:11px 16px; border-radius:10px; text-decoration:none; font-size:14px; font-weight:700; }
.primary { background:var(--ink); color:white; }
.ghost { background:var(--bg); color:var(--ink-2); border:1px solid var(--line); }
</style>
</head>
<body>
<main class="card">
  <div class="brand"><img src="images/logo.png" alt="" /><span>새싹매치</span></div>
  <h1 id="title">결제 승인 중입니다</h1>
  <p id="desc">토스페이먼츠 결제 정보를 확인하고 토큰을 적립하고 있어요.</p>
  <div class="box" id="result">잠시만 기다려주세요.</div>
  <div class="actions">
    <a class="primary" href="mypage.html">마이페이지</a>
    <a class="ghost" href="index.html#pricing">요금제로 돌아가기</a>
  </div>
</main>
<script>
async function confirmPayment(){
  const params = new URLSearchParams(location.search);
  const paymentKey = params.get("paymentKey");
  const orderId = params.get("orderId");
  const amount = Number(params.get("amount"));
  const result = document.getElementById("result");
  if(!paymentKey || !orderId || !amount){
    result.className = "box error";
    result.textContent = "결제 승인 정보가 부족합니다. 다시 시도해주세요.";
    return;
  }
  try {
    const res = await fetch("/api/toss-confirm", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ paymentKey, orderId, amount })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.message || data.error || "결제 승인 실패");
    const applied = window.saessak?.payments?.applyPaidProduct(data);
    if(!applied?.ok) throw new Error("결제는 승인됐지만 로그인 정보가 없어 토큰 적립을 완료하지 못했습니다.");
    document.getElementById("title").textContent = "결제가 완료됐습니다";
    document.getElementById("desc").textContent = "토큰이 계정에 반영됐습니다. 바로 이어서 신청 준비를 시작할 수 있어요.";
    result.textContent = `${data.product.label} · +${data.product.tokens.toLocaleString()} 토큰 적립 완료`;
  } catch(err){
    console.error(err);
    document.getElementById("title").textContent = "결제 확인이 필요합니다";
    result.className = "box error";
    result.textContent = err.message || "결제 승인 중 문제가 발생했습니다.";
  }
}
window.addEventListener("load", confirmPayment);
</script>
</body>
</html>
